[project]
name = "mystery"
version = "0.1.0"
description = "An AI-generated murder mystery: structured ground truth, a validator, and a cast of interrogable agents"
readme = "README.md"
authors = [
    { name = "FreddyDeWatersir", email = "freddyraul11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    # Only needed for the browser version, mystery.web
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Only for --portraits. The game runs without it.
portraits = ["openai>=1.50"]
# Only for running against AWS. A laptop needs none of it, and nothing in the
# test suite imports boto3: S3Shelf builds its client lazily and the tests pass
# a fake (D-118).
aws = ["boto3>=1.35"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# Only look for tests here. Stops pytest wandering into .venv or docs.
testpaths = ["tests"]
# -ra prints a summary of everything that did not plainly pass, at the end of the run.
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E   pycodestyle errors      formatting problems that are actually errors
# F   pyflakes                real bugs: unused imports, undefined names
# I   isort                   import ordering
# B   flake8-bugbear          likely bugs, e.g. mutable default arguments
# UP  pyupgrade               modernise syntax for the Python version you target
# SIM flake8-simplify         needlessly convoluted code
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Without this, ruff treats "mystery" as third-party and groups it with pytest.
known-first-party = ["mystery"]

[tool.ruff.lint.per-file-ignores]
# web.py embeds an HTML page, SVG path data included. Wrapping path data to
# satisfy a line-length rule would make it less readable, not more.
"src/mystery/web.py" = ["E501"]
